name: encore-local
services:
  db:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    environment:
      POSTGRES_USER: encore_local
      POSTGRES_PASSWORD: encore_local_only
      POSTGRES_DB: encore_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore_local -d encore_local"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
