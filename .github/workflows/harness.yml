name: Contributor harness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    name: Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm run cloud:setup
      - run: pnpm run context:check
        env:
          CONTEXT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
