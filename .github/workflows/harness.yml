name: Contributor and application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    name: Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm run cloud:setup
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run production:verify
      - run: pnpm run context:check
        env:
          CONTEXT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  database:
    name: Local PostgreSQL migration and persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:init
      - run: pnpm run db:generate
      - run: pnpm run db:up
      - run: pnpm run db:verify
      - run: pnpm run ledger:verify
      - run: pnpm run ledger:service:verify
      - run: pnpm run venue:access:verify
      - run: pnpm run owner:read:verify
      - run: pnpm run auth:init
      - run: pnpm run auth:seed
      - run: pnpm run auth:verify
      - run: pnpm run ledger:http:verify
      - run: pnpm run venue:http:verify
      - run: pnpm run owner:http:verify
      - run: pnpm run db:reset --confirm-local-reset
      - run: pnpm run db:seed
      - run: pnpm run auth:seed
      - run: pnpm run auth:verify
      - run: pnpm run db:down
        if: always()
  windows-browser:
    name: Hosted Windows browser and PostgreSQL
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # Native PostgreSQL on a disposable runner; this is not Docker Desktop evidence.
      - uses: ikalnytskyi/action-setup-postgres@325155bfd7807b2a21ac9c2c7bb9b9a6eacc44df # v9
        with:
          postgres-version: '17'
          username: encore_local
          password: encore_local_only
          database: encore_local
          port: '54329'
      - run: pnpm run db:init
      - run: pnpm run db:generate
      - run: pnpm run db:migrate
      - run: pnpm run db:seed
      - run: pnpm run auth:init
      - run: pnpm run auth:seed
      - run: pnpm run browser:verify
      - run: pnpm run door:browser:verify
